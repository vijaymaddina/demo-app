name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/vijaymaddina/demo-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app code
        uses: actions/checkout@v4

      - name: Set image tag from commit SHA
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}

      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          repository: vijaymaddina/demo-app-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config

      - name: Update dev image tag and push
        working-directory: config/overlays/dev
        run: |
          kustomize edit set image ${IMAGE}=${IMAGE}:${TAG}
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -am "deploy demo-app ${TAG} to dev"
          git push
